<script>
// DAY: 16
// TITLE_ZH: Prim 與 Dijkstra：同一套 heap greedy 骨架
// TITLE_EN: Prim and Dijkstra - one heap-greedy skeleton
// SUB_ZH: 兩個看起來完全不同的演算法，程式碼只差一個 key：Prim 比「這條邊多貴」，Dijkstra 比「走到那裡總共多貴」。
// SUB_EN: Two algorithms that look unrelated are one lambda apart - Prim compares the edge, Dijkstra compares the whole path.
// FOLDER: day%2016%20-%20prim%20and%20dijkstra
// MEDIUM: https://medium.com/100-days-of-python

const NM = 'ABCDEFG';
const P = [[1.1, 3.3], [3.4, 2.4], [7.0, 3.0], [2.4, 4.4], [5.4, 4.4], [2.5, 6.2], [7.6, 5.8]];
const G = [[7, 0, 1], [5, 0, 3], [8, 1, 2], [9, 1, 3], [7, 1, 4], [5, 2, 4],
           [15, 3, 4], [6, 3, 5], [8, 4, 5], [9, 4, 6], [11, 5, 6]];
const RAD = .46, INF = Infinity;
const ekey = (u, v) => Math.min(u, v) + '-' + Math.max(u, v);

function adjOf(edges, n){
  const a = []; for (let i = 0; i < n; i++) a.push([]);
  edges.forEach(([w, u, v]) => { a[u].push([v, w]); a[v].push([u, w]); });
  return a;
}
const ADJ = adjOf(G, 7);

function gShapes(o){
  o = o || {}; const out = [];
  G.forEach(([w, u, v]) => {
    const st = (o.est && o.est[ekey(u, v)]) || 'ghost';
    const [x1, y1] = P[u], [x2, y2] = P[v];
    const dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
    out.push(S.e(x1 + ux * RAD, y1 + uy * RAD, x2 - ux * RAD, y2 - uy * RAD,
      {s:st, w:(st === 'ok' || st === 'done') ? .12 : .05, noArrow:true}));
    out.push(S.t((x1 + x2) / 2 + uy * .30, (y1 + y2) / 2 - ux * .30, String(w),
      {c:st === 'ghost' ? '#8fa3ac' : (st === 'bad' ? '#ff5c5c' : '#ffbe6b'), fs:.28}));
  });
  for (let i = 0; i < NM.length; i++){
    const lb = (o.best && o.best[i] != null && o.best[i] < INF) ? String(o.best[i]) : '';
    out.push(S.c(P[i][0], P[i][1], RAD, (o.st && o.st[i]) || 'idle', NM[i],
      lb === '' ? {fs:.32} : {fs:.32, sub:lb, subfs:.26}));
  }
  return out;
}
function heapPanel(pq, done){
  const items = pq.slice().sort((a, b) => a[0] - b[0]);
  return {lbl:{zh:'heap（最小的在前）', en:'heap (smallest first)'},
    chips:items.length ? items.map(([d, u], i) => ({t:NM[u] + ':' + d + (done[u] ? ' x' : ''),
      cls:done[u] ? 'bad' : (i === 0 ? 'hot' : '')}))
      : [{t:LANG === 'zh' ? '空' : 'empty', cls:''}]};
}
function bestPanel(best, done, lbl){
  return {lbl:lbl, chips:best.map((b, i) => ({t:NM[i] + ' ' + (b < INF ? b : '∞'),
    cls:done[i] ? 'ok' : (b < INF ? '' : 'soft')}))};
}

const CODE = [
'def heap_greedy(n, adj, src, key):',
'    best   = [INF] * n',
'    parent = [-1] * n',
'    done   = [False] * n',
'    best[src] = 0; pq = [(0, src)]',
'',
'    while pq:',
'        d, u = heappop(pq)',
'        if done[u]: continue          # 堆裡的舊副本',
'        done[u] = True',
'        for v, w in adj[u]:',
'            nd = key(d, w)            # Prim: w   Dijkstra: d + w',
'            if not done[v] and nd < best[v]:',
'                best[v] = nd; parent[v] = u',
'                heappush(pq, (nd, v))',
'    return best, parent'];

// ---- tab 1: the shared skeleton -------------------------------------------
function buildSkeleton(v){
  const F = new Frames(), n = 7, isPrim = (v === 0);
  const key = isPrim ? ((d, w) => w) : ((d, w) => d + w);
  const best = [], parent = [], done = [], est = {};
  for (let i = 0; i < n; i++){ best.push(INF); parent.push(-1); done.push(false); }
  best[0] = 0;
  let pq = [[0, 0]], total = 0;
  const st = () => { const s = {}; for (let i = 0; i < n; i++)
      s[i] = done[i] ? 'ok' : (best[i] < INF ? 'soft' : 'idle'); return s; };
  const snap = (extra, line, msg) => F.push({
    shapes:gShapes({est:Object.assign({}, est, extra && extra.est),
                    st:Object.assign(st(), extra && extra.st), best:best}),
    panels:[heapPanel(pq, done), bestPanel(best, done,
      isPrim ? {zh:'best = 接上這棵樹最便宜的一條邊', en:'best = cheapest edge into the tree'}
             : {zh:'best = 從 A 走過來的最短距離', en:'best = shortest distance from A'})],
    line:line, msg:msg});

  snap({st:{0:'hot'}}, 4, isPrim
    ? {zh:'<b>Prim</b>：從 A 開始，讓一棵樹<b>長大</b>。每一步問「把哪個還沒進來的點拉進來最便宜」，' +
          '比的是<b>那一條邊的重量</b>。heap 裡放的就是每個外點目前<b>最便宜的入場券</b>。',
       en:'<b>Prim</b>: start at A and <b>grow one tree</b>. Each step asks which outside vertex is cheapest to pull in, comparing <b>the weight of that single edge</b>. The heap holds each outsider\'s current <b>cheapest ticket in</b>.'}
    : {zh:'<b>Dijkstra</b>：一模一樣的迴圈、一模一樣的 heap，只有 <code>key</code> 換成 <code>d + w</code>。' +
          '現在 heap 裡放的不是入場券，而是<b>從 A 一路走過來的總距離</b>。',
       en:'<b>Dijkstra</b>: identical loop, identical heap, only <code>key</code> becomes <code>d + w</code>. Now the heap holds not a ticket price but the <b>total distance walked from A</b>.'});

  let guard = 0;
  while (pq.length && guard++ < 60){
    pq.sort((a, b) => a[0] - b[0]);
    const top = pq.shift(), d = top[0], u = top[1];
    if (done[u]){
      snap({st:{[u]:'bad'}}, 8,
        {zh:'彈出 <b>' + NM[u] + ':' + d + '</b>，但 ' + NM[u] + ' 早就處理完了。' +
            '我們<b>從來沒有真的去 heap 裡改舊資料</b>（那要 O(n) 找），而是直接再 push 一份新的，' +
            '舊的留在裡面變成垃圾——這叫 <b>lazy deletion</b>，一行 <code>if done[u]: continue</code> 就清掉。',
         en:'Pop <b>' + NM[u] + ':' + d + '</b> - but ' + NM[u] + ' is already settled. We never edit an entry inside the heap (finding it would cost O(n)); we push a fresh copy and let the stale one rot. That is <b>lazy deletion</b>, cleaned up by the single line <code>if done[u]: continue</code>.'});
      continue;
    }
    done[u] = true;
    if (parent[u] >= 0){ est[ekey(parent[u], u)] = 'ok'; total += isPrim ? d : (d - best[parent[u]]); }
    snap({st:{[u]:'hot'}}, 9, u === 0
      ? {zh:'A 先進來，距離 0。<b>heap 的最小值就是下一個該定案的點</b>——這是整個演算法唯一的推理。',
         en:'A settles first at 0. <b>The minimum of the heap is the next vertex that can be finalised</b> - that single claim is the whole algorithm.'}
      : (isPrim
        ? {zh:'<b>' + NM[u] + '</b> 是目前最便宜的入場券（' + d + '，從 ' + NM[parent[u]] + ' 接進來）。' +
              '為什麼可以直接定案？因為任何連到樹外的路，<b>第一條跨出樹的邊都不會比它便宜</b>——' +
              '這就是昨天 Kruskal 用的 cut property，只是這裡的 cut 固定是「樹 ｜ 其他」。' +
              '所以 <b>' + NM[parent[u]] + NM[u] + ' 這條邊確定屬於最終的 MST</b>，不會再被換掉；' +
              '樹的總重量現在是 <b>' + total + '</b>。',
           en:'<b>' + NM[u] + '</b> has the cheapest ticket (' + d + ', entering from ' + NM[parent[u]] + '). Why can it be finalised on the spot? Any route out of the tree must cross the boundary somewhere, and <b>no crossing edge is cheaper than this one</b> - the same cut property Kruskal used yesterday, with the cut fixed as "tree | rest". So <b>' + NM[parent[u]] + NM[u] + ' is now certain to be in the final MST</b> and will never be swapped out. The tree weighs <b>' + total + '</b>.'}
        : {zh:'<b>' + NM[u] + '</b> 定案在 <b>' + d + '</b>。為什麼不用怕之後冒出更短的路？' +
              '任何別的路都得先經過一個<b>還在 heap 裡的點</b>，而那個點的距離 ≥ ' + d + '，' +
              '再加上非負的邊只會更長。<b>「邊不能是負的」這個前提，就藏在這句話裡。</b>',
           en:'<b>' + NM[u] + '</b> is fixed at <b>' + d + '</b>. Why can no shorter route appear later? Any alternative must pass through a vertex still in the heap, whose distance is already >= ' + d + ', and adding non-negative edges only makes it longer. <b>The requirement that weights are non-negative lives entirely inside that sentence.</b>'}));
    const improved = [], hotE = {};
    ADJ[u].forEach(pair => {
      const v2 = pair[0], w = pair[1], nd = key(d, w);
      if (!done[v2] && nd < best[v2]){
        best[v2] = nd; parent[v2] = u; pq.push([nd, v2]);
        improved.push(NM[v2] + '=' + nd); hotE[ekey(u, v2)] = 'hot';
      }
    });
    if (improved.length)
      snap({st:{[u]:'ok'}, est:hotE}, 12,
        {zh:'放鬆 ' + NM[u] + ' 的鄰居，更新了 <b>' + improved.join('、') + '</b>。' +
            (isPrim ? '記住：Prim 存的是<b>邊的重量</b>，不累加，所以 ' + NM[u] +
                      ' 的鄰居可能比 ' + NM[u] + ' 自己的數字還小。'
                    : '記住：Dijkstra 存的是 <b>' + d + ' + 邊重</b>，會一路累加下去。') +
            '被改到的點<b>再 push 一份</b>進 heap，舊的那份不動。',
         en:'Relaxing ' + NM[u] + '\'s neighbours updates <b>' + improved.join(', ') + '</b>. ' +
            (isPrim ? 'Remember that Prim stores <b>the edge weight itself</b>, with no accumulation, so a neighbour can carry a smaller number than ' + NM[u] + ' did.'
                    : 'Remember that Dijkstra stores <b>' + d + ' + edge</b>, accumulating all the way.') +
            ' Each improved vertex gets <b>a fresh copy pushed</b>; the old entry is left alone.'});
  }
  const treeE = {}; for (let i = 1; i < 7; i++) if (parent[i] >= 0) treeE[ekey(parent[i], i)] = 'ok';
  F.push({shapes:gShapes({est:treeE, st:st(), best:best}),
    panels:[heapPanel(pq, done), bestPanel(best, done, {zh:'結果', en:'result'})],
    line:15,
    msg:isPrim
      ? {zh:'7 個點全部進來，總權重 <b>' + total + '</b>——和昨天 Kruskal 算出來的<b>完全一樣</b>，' +
            '雖然收邊的順序不同。複雜度 <b>O(E log V)</b>：每條邊最多 push 一次。',
         en:'All seven vertices are in and the tree weighs <b>' + total + '</b> - <b>exactly</b> what Kruskal produced yesterday, even though the edges were taken in a different order. Complexity <b>O(E log V)</b>: every edge is pushed at most once.'}
      : {zh:'每個點的最短距離都定案了：' + best.map((b, i) => NM[i] + '=' + b).join('、') + '。' +
            '同樣是 <b>O(E log V)</b>，同樣的一份程式碼。<b>差別只有那個 lambda。</b>',
         en:'Every shortest distance is final: ' + best.map((b, i) => NM[i] + '=' + b).join(', ') +

  sub:{zh:DAY_META.sub.zh, en:DAY_META.sub.en},
  play:{zh:'▶ 播放', en:'▶ Play'}, pause:{zh:'❚❚ 暫停', en:'❚❚ Pause'},
  speed:{zh:'速度', en:'Speed'}, state:{zh:'演算法狀態', en:'Algorithm state'},
  code:{zh:'程式碼', en:'Code'}, idea:{zh:'重點', en:'The idea'}
};
let LANG = 'zh';
const tr = o => (o == null ? '' : (typeof o === 'string' ? o : (o[LANG] != null ? o[LANG] : o.en)));
const $ = id => document.getElementById(id);

function setLang(l){
  LANG = l;
  document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'en';
  $('btn-zh').classList.toggle('on', l === 'zh');
  $('btn-en').classList.toggle('on', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = tr(T[k]);
  });
  buildTabs(); render();
}

/* --------------------------------------------------------------- palette */
const STY = {
  idle :{fill:'#07293a', stroke:'#0a6b74', text:'#dff2f5', w:.045, glow:0},
  soft :{fill:'#052330', stroke:'#0a6b74', text:'#a8c8d0', w:.035, glow:0},
  hot  :{fill:'#3a2109', stroke:'#ff9736', text:'#ffbe6b', w:.075, glow:.65},
  act  :{fill:'#241542', stroke:'#9d6bff', text:'#c7a6ff', w:.070, glow:.55},
  ok   :{fill:'#08414a', stroke:'#3fe0dd', text:'#d9ffff', w:.070, glow:.5},
  done :{fill:'#062430', stroke:'#2f5661', text:'#7f9aa3', w:.035, glow:0},
  bad  :{fill:'#3a0d0d', stroke:'#ff5c5c', text:'#ff9a9a', w:.070, glow:.4},
  ghost:{fill:'none',    stroke:'#2f5661', text:'#7f9aa3', w:.035, glow:0, dash:'.12 .10'}
};
const COL = {teal:'#12b3b8', tealL:'#3fe0dd', purple:'#9d6bff', purpleL:'#c7a6ff',
             orange:'#ff9736', orangeL:'#ffbe6b', red:'#ff5c5c', grey:'#8fa3ac',
             pale:'#dff2f5', white:'#ffffff'};
const LEGEND = {
  hot:[COL.orange, {zh:'目前這一步', en:'current step'}],
  act:[COL.purple, {zh:'指標 / 走訪位置', en:'pointer / cursor'}],
  ok:[COL.tealL,  {zh:'完成 / 結果', en:'done / result'}],
  bad:[COL.red,   {zh:'失敗 / 要避開的寫法', en:'failure / the wrong way'}],
  done:['#2f5661', {zh:'已處理完', en:'already done'}],
  soft:['#0a6b74', {zh:'其他元素', en:'other items'}],
  idle:['#0a6b74', {zh:'尚未處理', en:'untouched'}],
  ghost:['#123f4d', {zh:'尚未處理', en:'not yet reached'}]
};
const leg = (...keys) => keys.map(k => LEGEND[k]);

/* ---------------------------------------------------------- frame buffer */
function Frames(){
  this.list = [];
  this.push = (o) => this.list.push({
    shapes:JSON.parse(JSON.stringify(o.shapes || [])),
    panels:JSON.parse(JSON.stringify(o.panels || [])),
    view:(o.view || null), line:(o.line == null ? 0 : o.line), msg:o.msg
  });
}
/* shape helpers - engines call these, the renderer just draws */
const S = {
  r:(x, y, w, h, s, lab, o) => Object.assign({t:'r', x:x, y:y, w:w, h:h, s:s || 'idle', lab:lab}, o || {}),
  c:(x, y, r, s, lab, o) => Object.assign({t:'c', x:x, y:y, r:r, s:s || 'idle', lab:lab}, o || {}),
  e:(x1, y1, x2, y2, o) => Object.assign({t:'e', x1:x1, y1:y1, x2:x2, y2:y2}, o || {}),
  t:(x, y, s, o) => Object.assign({t:'t', x:x, y:y, s:s}, o || {})
};
/* a labelled row of array cells; returns shapes */
function cellRow(vals, x0, y, w, h, opt){
  opt = opt || {};
  const out = [], st = opt.states || {};
  vals.forEach((v, i) => {
    out.push(S.r(x0 + i * w, y, w - (opt.gap == null ? .06 : opt.gap), h, st[i] || 'idle',
                 v == null ? '' : String(v), {fs:opt.fs || h * .52}));
    if (opt.index !== false)
      out.push(S.t(x0 + i * w + (w - .06) / 2, y + h + (opt.ilift || .34),
                   opt.labels ? opt.labels[i] : String(i),
                   {c:st[i] && st[i] !== 'idle' ? COL.orangeL : COL.grey, fs:opt.ifs || .30}));
  });
  if (opt.title) out.push(S.t(x0 - .22, y + h * .62, opt.title, {c:COL.tealL, fs:.32, anchor:'end'}));
  return out;
}
/* binary-tree layout from a heap-style array (index 0 = root, 2i+1 / 2i+2) */
function heapTreeShapes(arr, x0, y0, w, rowH, states, opt){
  opt = opt || {};
  const n = arr.length, out = [], R = opt.r || .34;
  const depth = i => Math.floor(Math.log2(i + 1));
  const maxD = n ? depth(n - 1) : 0;
  const px = i => {
    const d = depth(i), first = Math.pow(2, d) - 1, k = i - first;
    const slots = Math.pow(2, d), span = w;
    return x0 + span * (k + .5) / slots;
  };
  const py = i => y0 + depth(i) * rowH;
  for (let i = 1; i < n; i++){
    if (arr[i] == null) continue;
    const p = Math.floor((i - 1) / 2);
    out.push(S.e(px(p), py(p), px(i), py(i), {pad:R + .04,
      s:(states && (states[i] === 'hot' || states[i] === 'act')) ? states[i] : 'idle'}));
  }
  for (let i = 0; i < n; i++){
    if (arr[i] == null) continue;
    out.push(S.c(px(i), py(i), R, (states && states[i]) || 'idle', String(arr[i]), {fs:R * .95}));
    if (opt.showIndex)
      out.push(S.t(px(i), py(i) + R + .34, String(i), {c:COL.grey, fs:.26}));
  }
  return out;
}

/* -------------------------------------------------------------- renderer */
const svgNS = 'http://www.w3.org/2000/svg';
const mk = (tag, a) => { const e = document.createElementNS(svgNS, tag);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const clear = svg => { while (svg.firstChild) svg.removeChild(svg.firstChild); };

function defs(svg){
  const d = mk('defs', {});
  const f = mk('filter', {id:'glow', x:'-70%', y:'-70%', width:'240%', height:'240%'});
  f.appendChild(mk('feGaussianBlur', {stdDeviation:'.055', result:'b'}));
  const m = mk('feMerge', {});
  m.appendChild(mk('feMergeNode', {in:'b'}));
  m.appendChild(mk('feMergeNode', {in:'SourceGraphic'}));
  f.appendChild(m); d.appendChild(f);
  Object.keys(STY).forEach(k => {
    const mk2 = mk('marker', {id:'ar-' + k, viewBox:'0 0 10 10', refX:'8.5', refY:'5',
      markerWidth:'5.2', markerHeight:'5.2', orient:'auto-start-reverse'});
    mk2.appendChild(mk('path', {d:'M 0 1 L 9 5 L 0 9 z', fill:STY[k].stroke}));
    d.appendChild(mk2);
  });
  svg.appendChild(d);
}

function drawShape(svg, sh){
  const st = STY[sh.s || 'idle'];
  if (sh.t === 'e'){
    let {x1, y1, x2, y2} = sh;
    if (sh.pad){
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
      x1 += dx / L * sh.pad; y1 += dy / L * sh.pad;
      x2 -= dx / L * sh.pad; y2 -= dy / L * sh.pad;
    }
    const a = {x1:x1.toFixed(3), y1:y1.toFixed(3), x2:x2.toFixed(3), y2:y2.toFixed(3),
      stroke:st.stroke, 'stroke-width':(sh.w || st.w || .05), 'stroke-linecap':'round',
      opacity:(sh.o == null ? (sh.s && sh.s !== 'idle' ? 1 : .75) : sh.o)};
    if (sh.dash || st.dash) a['stroke-dasharray'] = sh.dash || st.dash;
    if (sh.arrow !== false) a['marker-end'] = 'url(#ar-' + (sh.s || 'idle') + ')';
    svg.appendChild(mk('line', a));
    if (sh.lab != null)
      svg.appendChild(txt((x1 + x2) / 2 + (sh.lx || 0), (y1 + y2) / 2 + (sh.ly || -.16),
        tr(sh.lab), st.stroke, sh.fs || .30, 'middle'));
    return;
  }
  if (sh.t === 't'){
    svg.appendChild(txt(sh.x, sh.y, tr(sh.s), sh.c || COL.pale, sh.fs || .32,
      sh.anchor || 'middle', sh.o));
    return;
  }
  let node;
  if (sh.t === 'c'){
    node = mk('circle', {cx:sh.x.toFixed(3), cy:sh.y.toFixed(3), r:sh.r.toFixed(3),
      fill:st.fill, stroke:st.stroke, 'stroke-width':st.w});
  } else {
    node = mk('rect', {x:sh.x.toFixed(3), y:sh.y.toFixed(3), width:sh.w.toFixed(3),
      height:sh.h.toFixed(3), rx:(sh.rx == null ? .09 : sh.rx), fill:st.fill,
      stroke:st.stroke, 'stroke-width':st.w});
  }
  if (st.dash || sh.dash) node.setAttribute('stroke-dasharray', sh.dash || st.dash);
  if (st.glow) node.setAttribute('filter', 'url(#glow)');
  if (sh.o != null) node.setAttribute('opacity', sh.o);
  svg.appendChild(node);
  const cx = sh.t === 'c' ? sh.x : sh.x + sh.w / 2;
  const cy = sh.t === 'c' ? sh.y : sh.y + sh.h / 2;
  if (sh.lab != null && sh.lab !== '')
    svg.appendChild(txt(cx + (sh.dx || 0), cy + (sh.fs || .40) * .35, tr(sh.lab), st.text,
      sh.fs || .40, 'middle'));
  if (sh.sub != null)
    svg.appendChild(txt(cx, cy + (sh.t === 'c' ? sh.r : sh.h) + .34, tr(sh.sub),
      sh.subc || COL.grey, sh.subfs || .28, 'middle'));
  if (sh.top != null)
    svg.appendChild(txt(cx, cy - (sh.t === 'c' ? sh.r : sh.h / 2) - .22, tr(sh.top),
      sh.topc || COL.purpleL, sh.topfs || .28, 'middle'));
}
function txt(x, y, s, c, fs, anchor, o){
  const t = mk('text', {x:(+x).toFixed(3), y:(+y).toFixed(3), 'text-anchor':anchor || 'middle',
    fill:c, 'font-size':(+fs).toFixed(3)});
  if (o != null) t.setAttribute('opacity', o);
  t.textContent = s;
  return t;
}

function renderStage(frame){
  const svg = $('stage');
  clear(svg); defs(svg);
  const v = frame.view || curTab().view || [10, 6.4];
  svg.setAttribute('viewBox', '0 0 ' + v[0] + ' ' + v[1]);
  (frame.shapes || []).forEach(sh => drawShape(svg, sh));
}

function drawPanels(frame){
  const box = $('panels'); box.innerHTML = '';
  (frame.panels || []).forEach(p => {
    const d = document.createElement('div'); d.className = 'panel';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = tr(p.lbl);
    const c = document.createElement('div'); c.className = 'chips';
    (p.chips.length ? p.chips : [{t:'—', cls:'empty'}]).forEach(ch => {
      const s = document.createElement('span');
      s.className = 'chip ' + (ch.cls || ''); s.textContent = ch.t; c.appendChild(s);
    });
    d.appendChild(l); d.appendChild(c); box.appendChild(d);
  });
}
function drawCode(frame){
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  $('code').innerHTML = curTab().code.map((ln, i) => {
    const h = esc(ln).replace(/(#.*)$/, '<span class="cm">$1</span>');
    return '<span class="ln' + (i === frame.line ? ' on' : '') + '">' + (h || ' ') + '</span>';
  }).join('');
}
function drawLegend(){
  const keys = curTab().legend || ['hot', 'act', 'ok', 'idle'];
  $('legend').innerHTML = keys.map(k => {
    const [c, txt] = Array.isArray(k) ? k : LEGEND[k];
    return '<span><i style="background:' + c + '"></i>' + tr(txt) + '</span>';
  }).join('');
}

let tabIx = 0, varIx = 0, frames = [], cur = 0, timer = null;
const TABS = DAY_META.tabs;
const curTab = () => TABS[tabIx];

function render(){
  if (!frames.length) return;
  cur = Math.max(0, Math.min(cur, frames.length - 1));
  const f = frames[cur];
  $('stage-title').textContent = tr(curTab().stage);
  renderStage(f); drawPanels(f); drawCode(f); drawLegend();
  $('narr').innerHTML = tr(f.msg);
  $('idea').innerHTML = tr(curTab().idea);
  $('stepno').textContent = (cur + 1) + ' / ' + frames.length;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === frames.length - 1;
}
function buildTabs(){
  $('tabs').innerHTML = '';
  TABS.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = tr(t.label);
    if (i === tabIx) b.classList.add('on');
    b.onclick = () => { tabIx = i; varIx = 0; load(); };
    $('tabs').appendChild(b);
  });
  const ex = $('extra'); ex.innerHTML = '';
  const vs = curTab().variants;
  if (vs) vs.forEach((v, i) => {
    const b = document.createElement('button');
    b.textContent = tr(v);
    if (i === varIx) b.classList.add('on');
    b.onclick = () => { varIx = i; load(); };
    ex.appendChild(b);
  });
}
function load(){
  stop();
  frames = curTab().build(varIx) || [];
  cur = 0; buildTabs(); render();
}
function step(d){ stop(); cur += d; render(); }
function reset(){ stop(); cur = 0; render(); }
function stop(){ if (timer){ clearInterval(timer); timer = null; $('play').textContent = tr(T.play); } }
function togglePlay(){
  if (timer){ stop(); return; }
  if (cur >= frames.length - 1) cur = 0;
  $('play').textContent = tr(T.pause);
  timer = setInterval(() => {
    if (cur >= frames.length - 1){ stop(); return; }
    cur++; render();
  }, Number($('speed').value));
}
$('speed').addEventListener('input', () => { if (timer){ stop(); togglePlay(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ step(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ step(-1); e.preventDefault(); }
  else if (e.key === ' '){ togglePlay(); e.preventDefault(); }
});
setLang('zh');
load();

</script>
</body>
