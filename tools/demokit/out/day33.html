<script>
// DAY: 33
// TITLE_ZH: Day 33 — 動態規劃入門：爬樓梯與硬幣找零
// TITLE_EN: Dynamic programming from scratch - climbing stairs and coin change
// SUB_ZH: DP 不是一種新演算法，而是一次改寫：把重複展開的遞迴樹折成一張只填一次的表格。遞推式通常是簡單的那一半，真正會咬人的是「填表的順序」—— 兩個迴圈交換位置，程式不會報錯，只是回答了另一個問題。
// SUB_EN: Dynamic programming is not a new algorithm, it is a rewrite: fold a recursion tree that re-expands the same subproblem over and over into a table that fills each cell once. The recurrence is usually the easy half; the half that bites is the order you fill the table in - swap two loops and the program still runs, it just answers a different question.
// FOLDER: day%2033%20-%20dynamic%20programming%20basics
// MEDIUM: https://medium.com/100-days-of-python

const VIEW = [9.8, 6.4];
function chip(t, cls){ return {t:t, cls:cls || ''}; }

/* ======================================================================== *
 * Tab 1 - the recursion tree of f(5) and what memoisation prunes
 * ======================================================================== */
const CODE_TREE = [
  'def stairs(n, memo=None):',
  '    if memo is not None and n in memo:',
  '        return memo[n]        # cache hit - prune',
  '    if n <= 1:',
  '        return 1              # base case',
  '    r = stairs(n - 1, memo) + stairs(n - 2, memo)',
  '    if memo is not None:',
  '        memo[n] = r',
  '    return r'
];

function buildTree(n){
  const nodes = []; let id = 0;
  function rec(v, d){
    const me = {id:id++, n:v, d:d, kids:[]};
    nodes.push(me);
    if (v > 1){ me.kids.push(rec(v - 1, d + 1)); me.kids.push(rec(v - 2, d + 1)); }
    return me;
  }
  const root = rec(n, 0);
  let slot = 0;
  (function lay(t){
    if (!t.kids.length) t.slot = slot++;
    else { t.kids.forEach(lay); t.slot = (t.kids[0].slot + t.kids[t.kids.length - 1].slot) / 2; }
  })(root);
  return {root:root, nodes:nodes, leaves:slot};
}
const T5 = buildTree(5);
const TX0 = .55, TX1 = 9.25, TSW = (TX1 - TX0) / T5.leaves;
const TY0 = .80, TDY = 1.12, TR = .31;
const nx = t => TX0 + (t.slot + .5) * TSW;
const ny = t => TY0 + t.d * TDY;

function treeShapes(st, extra){
  const out = [];
  T5.nodes.forEach(t => t.kids.forEach(k => {
    const s = (st[k.id] === 'ghost') ? 'ghost' : 'soft';
    out.push(S.e(nx(t), ny(t), nx(k), ny(k), {arrow:false, pad:TR, s:s}));
  }));
  T5.nodes.forEach(t => out.push(S.c(nx(t), ny(t), TR, st[t.id] || 'idle', 'f' + t.n, {fs:.32})));
  return out.concat(extra || []);
}

function treeFrames(v){
  const memoMode = (v === 1);
  const F = new Frames();
  const st = {}; T5.nodes.forEach(t => st[t.id] = 'idle');
  const seen = {}; const memo = {};
  let calls = 0, hits = 0;
  const panels = () => [
    {lbl:{zh:'實際呼叫次數', en:'calls actually made'}, chips:[chip(String(calls), calls ? 'hot' : 'dim')]},
    {lbl:{zh:'子問題 f(n) 被算幾次', en:'times each f(n) is evaluated'},
     chips:Object.keys(seen).sort((a, b) => a - b).map(k =>
       chip('f' + k + ' x' + seen[k], seen[k] > 1 ? 'bad' : 'dim'))},
    {lbl:{zh:'快取命中（整棵子樹省掉）', en:'cache hits (whole subtree skipped)'},
     chips:[chip(String(hits), hits ? 'ok' : 'dim')]}
  ];
  function ghostSub(t){ t.kids.forEach(k => { st[k.id] = 'ghost'; ghostSub(k); }); }

  F.push({shapes:treeShapes(st), view:VIEW, line:0, panels:panels(),
    msg:{zh:'爬 n 階、一次一或兩階：f(n) = f(n-1) + f(n-2)。遞推式本身三秒就想得出來，問題全出在它「怎麼被執行」。',
         en:'Climb n stairs one or two at a time and f(n) = f(n-1) + f(n-2). The recurrence takes three seconds to write; everything that goes wrong is about how it gets executed.'}});

  function walk(t){
    calls++;
    if (memoMode && memo[t.n] !== undefined){
      hits++; st[t.id] = 'ok'; ghostSub(t);
      F.push({shapes:treeShapes(st), view:VIEW, line:2, panels:panels(),
        msg:{zh:'f(' + t.n + ') 之前算過，查表直接回 ' + memo[t.n] + '。虛線那一整片子樹一次都不會展開 —— 這一行就是 O(2^n) 掉到 O(n) 的地方。',
             en:'f(' + t.n + ') was computed already, so the memo hands back ' + memo[t.n] + ' immediately. The dashed subtree below is never expanded at all - this one line is the whole difference between O(2^n) and O(n).'}});
      return memo[t.n];
    }
    seen[t.n] = (seen[t.n] || 0) + 1;
    const dup = seen[t.n] > 1;
    st[t.id] = dup ? 'bad' : 'act';
    let msg;
    if (t.n <= 1)
      msg = {zh:'f(' + t.n + ') 是 base case，回 1。注意：葉子的數量就等於答案 —— 答案有多大，這棵樹就有多大，這是指數的來源。',
             en:'f(' + t.n + ') is a base case and returns 1. Note what that means: the number of leaves *is* the answer, so the tree is as big as the number it computes. That is where the exponent comes from.'};
    else if (dup)
      msg = {zh:'f(' + t.n + ') 第 ' + seen[t.n] + ' 次被展開。參數一樣，答案一定一樣，底下整段都是重算。重疊子問題就是這個紅色。',
             en:'f(' + t.n + ') is being expanded for the ' + seen[t.n] + 'th time. Same argument, so necessarily the same answer - everything below it is recomputation. The red nodes are exactly what "overlapping subproblems" means.'};
    else
      msg = {zh:'展開 f(' + t.n + ') = f(' + (t.n - 1) + ') + f(' + (t.n - 2) + ')：先往左走完，右邊才開始。',
             en:'Expand f(' + t.n + ') = f(' + (t.n - 1) + ') + f(' + (t.n - 2) + '). The left branch runs to completion before the right one starts.'};
    F.push({shapes:treeShapes(st), view:VIEW, line:(t.n <= 1 ? 4 : 5), panels:panels(), msg:msg});
    let r;
    if (t.n <= 1) r = 1;
    else r = walk(t.kids[0]) + walk(t.kids[1]);
    memo[t.n] = r;
    if (st[t.id] === 'act') st[t.id] = 'done';
    return r;
  }
  const ans = walk(T5.root);
  T5.nodes.forEach(t => { if (st[t.id] === 'act') st[t.id] = 'done'; });
  st[T5.root.id] = 'ok';
  const tail = memoMode
    ? {zh:'f(5) = ' + ans + '，只呼叫了 ' + calls + ' 次，其中 ' + hits + ' 次是查表。n = 30 時這個差距是 4,356,617 次對 59 次。',
       en:'f(5) = ' + ans + ' after only ' + calls + ' calls, ' + hits + ' of which were cache hits. At n = 30 the same comparison reads 4,356,617 calls against 59.'}
    : {zh:'f(5) = ' + ans + '，花了 ' + calls + ' 次呼叫，但不同的子問題只有 6 個。n = 30 時是 4,356,617 次對 31 個 —— 浪費 140,536 倍，而且 f(1) 被算了 832,040 次。',
       en:'f(5) = ' + ans + ' took ' + calls + ' calls even though there are only 6 distinct subproblems. At n = 30 that is 4,356,617 calls against 31 subproblems - 140,536x of pure waste, with f(1) alone evaluated 832,040 times.'};
  F.push({shapes:treeShapes(st, [S.t(4.9, 6.15,
      memoMode ? {zh:'記住答案 → 每個子問題只算一次', en:'remember answers -> each subproblem runs once'}
               : {zh:'同一個子問題一再重算 → 指數級', en:'the same subproblem, over and over -> exponential'},
      {c:memoMode ? '#3fe0dd' : '#ff5c5c', fs:.34})]),
    view:VIEW, line:8, panels:panels(), msg:tail});
  return F.list;
}

/* ======================================================================== *
 * Tab 2 - fold the tree into a one-dimensional table
 * ======================================================================== */
const CODE_TABLE = [
  'def stairs_table(n):',
  '    dp = [0] * (n + 1)',
  '    dp[0] = dp[1] = 1',
  '    for i in range(2, n + 1):',
  '        dp[i] = dp[i - 1] + dp[i - 2]',
  '    return dp[n]',
  '',
  'def stairs_rolling(n):',
  '    a, b = 1, 1           # dp[i-2], dp[i-1]',
  '    for _ in range(2, n + 1):',
  '        a, b = b, a + b   # the window slides',
  '    return b'
];
const TB_N = 10, TB_X0 = .75, TB_W = .80, TB_H = .82, TB_Y = 2.45;

function tableFrames(v){
  const rolling = (v === 1);
  const F = new Frames();
  const dp = new Array(TB_N + 1).fill(null);
  dp[0] = 1; dp[1] = 1;
  const draw = (st, extra) => cellRow(dp.map(x => x == null ? '' : x), TB_X0, TB_Y, TB_W, TB_H,
      {states:st, title:'dp', ilift:.34}).concat(extra || []);
  const pan = i => [
    {lbl:{zh:'已填好的格子', en:'cells filled so far'},
     chips:dp.filter(x => x != null).map((x, k) => chip('dp[' + k + ']=' + x, k === i ? 'hot' : 'dim'))},
    {lbl:{zh:'真正需要記住的值', en:'values actually kept'},
     chips:rolling ? [chip('a = ' + (dp[i - 2] == null ? 1 : dp[i - 2]), 'ok'),
                      chip('b = ' + (dp[i - 1] == null ? 1 : dp[i - 1]), 'ok')]
                   : [chip('the whole row, ' + (TB_N + 1) + ' cells', 'dim')]}
  ];
  F.push({shapes:draw({0:'ok', 1:'ok'}), view:VIEW, line:2, panels:pan(1),
    msg:{zh:'把遞迴樹壓成一列：dp[i] = 爬到第 i 階的走法數。base case 先寫死 dp[0] = dp[1] = 1，其餘由左往右填。',
         en:'Flatten the tree into a single row: dp[i] is the number of ways to reach step i. Hard-code the base cases dp[0] = dp[1] = 1 and fill left to right.'}});

  for (let i = 2; i <= TB_N; i++){
    dp[i] = dp[i - 1] + dp[i - 2];
    const st = {};
    for (let k = 0; k < i; k++) st[k] = rolling ? 'ghost' : 'done';
    st[i - 1] = 'hot'; st[i - 2] = 'hot'; st[i] = 'act';
    const extra = [S.t(4.9, 5.35,
      'dp[' + i + '] = dp[' + (i - 1) + '] + dp[' + (i - 2) + '] = ' + dp[i - 1] + ' + ' + dp[i - 2] + ' = ' + dp[i],
      {c:'#ffbe6b', fs:.40})];
    if (rolling){
      extra.push(S.r(3.30, 4.20, 1.10, .80, 'ok', String(dp[i - 2]), {fs:.40}));
      extra.push(S.r(4.90, 4.20, 1.10, .80, 'ok', String(dp[i - 1]), {fs:.40}));
      extra.push(S.t(3.85, 4.02, 'a', {c:'#3fe0dd', fs:.32}));
      extra.push(S.t(5.45, 4.02, 'b', {c:'#3fe0dd', fs:.32}));
      extra.push(S.t(4.90, 6.10, {zh:'虛線的格子從來沒被存起來 → O(1) 空間',
                                  en:'the dashed cells are never stored -> O(1) space'}, {c:'#8fa3ac', fs:.34}));
    }
    F.push({shapes:draw(st, extra), view:VIEW, line:(rolling ? 10 : 4), panels:pan(i),
      msg:{zh:'填 dp[' + i + ']：它只看左邊兩格，而且那兩格早就填好了 —— 這就是「順序」的全部意義。' +
             (rolling ? '既然只看兩格，整張表其實不用留。' : ''),

  'for a in range(1, amount + 1):  # amount loop OUTSIDE',

  '        if c <= a:',

];
const OC = [1, 2, 5], OA = 5;

function enumComb(coins, amount){
  const out = [];
  (function rec(i, rem, cur){
    if (rem === 0){ out.push(cur.slice()); return; }
    if (i >= coins.length) return;
    rec(i + 1, rem, cur);
    if (coins[i] <= rem){ cur.push(coins[i]); rec(i, rem - coins[i], cur); cur.pop(); }
  })(0, amount, []);
  return out;
}
function enumPerm(coins, amount){
  const out = [];
  (function rec(rem, cur){
    if (rem === 0){ out.push(cur.slice()); return; }
    coins.forEach(c => { if (c <= rem){ cur.push(c); rec(rem - c, cur); cur.pop(); } });
  })(amount, []);
  return out;
}

    matched.forEach(m => st[m.j] = 'hot');
    st[i] = truthy(i) ? 'act' : 'bad';
    const extra = [S.t(4.90, 5.10, matched.length
        ? 'dp[' + i + '] <- dp[' + matched[0].j + '] + "' + matched[0].w + '"'
        : {zh:'沒有任何切點成立 → dp[' + i + '] 留 ' + (count ? '0' : 'False'),
           en:'no cut point works -> dp[' + i + '] stays ' + (count ? '0' : 'False')},
      {c:matched.length ? '#ffbe6b' : '#ff9a9a', fs:.38})];
    F.push({shapes:draw(st, hi, extra), view:VIEW, line:(matched.length ? 6 : 5), panels:[
        {lbl:{zh:'成立的切點 j', en:'cut points j that work'},
         chips:matched.map(m => chip('j=' + m.j + ' "' + m.w + '"', 'hot'))},
        {lbl:{zh:'dp', en:'dp'}, chips:dp.map((x, k) => chip(String(count ? x : (x ? 'T' : 'F')), k === i ? 'act' : 'dim'))}],
      msg:matched.length
        ? {zh:'i = ' + i + '：找一個切點 j，要求前面 j 個字元切得開、而且 s[j:i] 是字典裡的字。找到 j = ' + matched[0].j + '，s[' + matched[0].j + ':' + i + '] = "' + matched[0].w + '"。',
           en:'i = ' + i + ': look for a cut point j where the prefix of length j already splits and s[j:i] is a dictionary word. Found j = ' + matched[0].j + ' with s[' + matched[0].j + ':' + i + '] = "' + matched[0].w + '".'}
        : {zh:'i = ' + i + '：每個 j 都試過了，沒有一個同時滿足兩個條件，所以這個前綴切不開。失敗也是要被記下來的答案。',
           en:'i = ' + i + ': every j has been tried and none satisfies both conditions, so this prefix cannot be split. A failure is an answer too, and it has to be written down.'}});
  }
  const stF = {}; for (let k = 0; k <= n; k++) stF[k] = truthy(k) ? 'ok' : 'done';
  const okEnd = truthy(n);
  stF[n] = okEnd ? 'ok' : 'bad';
  F.push({shapes:draw(stF, null, [S.t(4.90, 5.10,
      count ? {zh:'dp[13] = 1 → 只有一種切法：apple | pen | apple', en:'dp[13] = 1 - one way: apple | pen | apple'}
            : (okEnd ? {zh:'dp[13] = True → apple | pen | apple', en:'dp[13] = True -> apple | pen | apple'}
                     : {zh:'dp[9] = False → 這串字切不開', en:'dp[9] = False -> this string cannot be split'}),
      {c:okEnd ? '#3fe0dd' : '#ff5c5c', fs:.38}),
      S.t(4.90, 5.90, count ? {zh:'把 or 換成 +，同一張表就從「能不能」變成「有幾種」',
                               en:'swap `or` for `+`: same table, now it counts'}
                            : {zh:'+ 算方法數、min 求最佳、or 判可行 —— 三題一張表',
                               en:'`+` counts, `min` optimises, `or` decides'},
      {c:'#8fa3ac', fs:.32})]),
    view:VIEW, line:8, panels:[
      {lbl:{zh:'答案', en:'answer'}, chips:[chip(count ? String(dp[n]) : String(okEnd), okEnd ? 'ok' : 'bad')]}],
    msg:okEnd
      ? (count
        ? {zh:'1 種。合併步驟從 or 換成 + 就從判定題變成計數題，程式其他地方一個字都沒改 —— 這是今天真正要記住的東西。',
           en:'One. Changing the combine step from `or` to `+` turns a decision problem into a counting problem without touching another character of the code - that is the thing worth remembering today.'}
        : {zh:'True。注意那個 break：判定題找到一個切點就夠了；但要算方法數就不能 break，否則會漏算。',
           en:'True. Note the break: for a decision one working cut point is enough. For a count you must not break, or you will miss segmentations.'})
      : {zh:'False。"cat"、"cats"、"sand"、"and" 沿路都對得上，最後卻卡在 "og"。貪心地「看到字就切」會在這裡選錯；DP 之所以對，是因為它把每個切點都記了下來。',
         en:'False. "cat", "cats", "sand" and "and" all match along the way, yet the string dies on "og". A greedy "cut as soon as a word matches" scanner picks wrong here; the DP is correct precisely because it records every cut point.'}});
  return F.list;
}

<script>
/* =========================================================================
   100 Days of Python - shared demo engine
   palette: teal/blue-green base, purple pointers, orange "current step"
   ========================================================================= */
const T = {
  title:{zh:DAY_META.title.zh, en:DAY_META.title.en},
  sub:{zh:DAY_META.sub.zh, en:DAY_META.sub.en},
  play:{zh:'▶ 播放', en:'▶ Play'}, pause:{zh:'❚❚ 暫停', en:'❚❚ Pause'},
  speed:{zh:'速度', en:'Speed'}, state:{zh:'演算法狀態', en:'Algorithm state'},
  code:{zh:'程式碼', en:'Code'}, idea:{zh:'重點', en:'The idea'}
};
let LANG = 'zh';
const tr = o => (o == null ? '' : (typeof o === 'string' ? o : (o[LANG] != null ? o[LANG] : o.en)));
const $ = id => document.getElementById(id);

function setLang(l){
  LANG = l;
  document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'en';
  $('btn-zh').classList.toggle('on', l === 'zh');
  $('btn-en').classList.toggle('on', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = tr(T[k]);
  });
  buildTabs(); render();
}

/* --------------------------------------------------------------- palette */
const STY = {
  idle :{fill:'#07293a', stroke:'#0a6b74', text:'#dff2f5', w:.045, glow:0},
  soft :{fill:'#052330', stroke:'#0a6b74', text:'#a8c8d0', w:.035, glow:0},
  hot  :{fill:'#3a2109', stroke:'#ff9736', text:'#ffbe6b', w:.075, glow:.65},
  act  :{fill:'#241542', stroke:'#9d6bff', text:'#c7a6ff', w:.070, glow:.55},
  ok   :{fill:'#08414a', stroke:'#3fe0dd', text:'#d9ffff', w:.070, glow:.5},
  done :{fill:'#062430', stroke:'#2f5661', text:'#7f9aa3', w:.035, glow:0},
  bad  :{fill:'#3a0d0d', stroke:'#ff5c5c', text:'#ff9a9a', w:.070, glow:.4},
  ghost:{fill:'none',    stroke:'#2f5661', text:'#7f9aa3', w:.035, glow:0, dash:'.12 .10'}
};
const COL = {teal:'#12b3b8', tealL:'#3fe0dd', purple:'#9d6bff', purpleL:'#c7a6ff',
             orange:'#ff9736', orangeL:'#ffbe6b', red:'#ff5c5c', grey:'#8fa3ac',
             pale:'#dff2f5', white:'#ffffff'};
const LEGEND = {
  hot:[COL.orange, {zh:'目前這一步', en:'current step'}],
  act:[COL.purple, {zh:'指標 / 走訪位置', en:'pointer / cursor'}],
  ok:[COL.tealL,  {zh:'完成 / 結果', en:'done / result'}],
  bad:[COL.red,   {zh:'失敗 / 要避開的寫法', en:'failure / the wrong way'}],
  done:['#2f5661', {zh:'已處理完', en:'already done'}],
  soft:['#0a6b74', {zh:'其他元素', en:'other items'}],
  idle:['#0a6b74', {zh:'尚未處理', en:'untouched'}],
  ghost:['#123f4d', {zh:'尚未處理', en:'not yet reached'}]
};
const leg = (...keys) => keys.map(k => LEGEND[k]);

/* ---------------------------------------------------------- frame buffer */
function Frames(){
  this.list = [];
  this.push = (o) => this.list.push({
    shapes:JSON.parse(JSON.stringify(o.shapes || [])),
    panels:JSON.parse(JSON.stringify(o.panels || [])),
    view:(o.view || null), line:(o.line == null ? 0 : o.line), msg:o.msg
  });
}
/* shape helpers - engines call these, the renderer just draws */
const S = {
  r:(x, y, w, h, s, lab, o) => Object.assign({t:'r', x:x, y:y, w:w, h:h, s:s || 'idle', lab:lab}, o || {}),
  c:(x, y, r, s, lab, o) => Object.assign({t:'c', x:x, y:y, r:r, s:s || 'idle', lab:lab}, o || {}),
  e:(x1, y1, x2, y2, o) => Object.assign({t:'e', x1:x1, y1:y1, x2:x2, y2:y2}, o || {}),
  t:(x, y, s, o) => Object.assign({t:'t', x:x, y:y, s:s}, o || {})
};
/* a labelled row of array cells; returns shapes */
function cellRow(vals, x0, y, w, h, opt){
  opt = opt || {};
  const out = [], st = opt.states || {};
  vals.forEach((v, i) => {
    out.push(S.r(x0 + i * w, y, w - (opt.gap == null ? .06 : opt.gap), h, st[i] || 'idle',
                 v == null ? '' : String(v), {fs:opt.fs || h * .52}));
    if (opt.index !== false)
      out.push(S.t(x0 + i * w + (w - .06) / 2, y + h + (opt.ilift || .34),
                   opt.labels ? opt.labels[i] : String(i),
                   {c:st[i] && st[i] !== 'idle' ? COL.orangeL : COL.grey, fs:opt.ifs || .30}));
  });
  if (opt.title) out.push(S.t(x0 - .22, y + h * .62, opt.title, {c:COL.tealL, fs:.32, anchor:'end'}));
  return out;
}
/* binary-tree layout from a heap-style array (index 0 = root, 2i+1 / 2i+2) */
function heapTreeShapes(arr, x0, y0, w, rowH, states, opt){
  opt = opt || {};
  const n = arr.length, out = [], R = opt.r || .34;
  const depth = i => Math.floor(Math.log2(i + 1));
  const maxD = n ? depth(n - 1) : 0;
  const px = i => {
    const d = depth(i), first = Math.pow(2, d) - 1, k = i - first;
    const slots = Math.pow(2, d), span = w;
    return x0 + span * (k + .5) / slots;
  };
  const py = i => y0 + depth(i) * rowH;
  for (let i = 1; i < n; i++){
    if (arr[i] == null) continue;
    const p = Math.floor((i - 1) / 2);
    out.push(S.e(px(p), py(p), px(i), py(i), {pad:R + .04,
      s:(states && (states[i] === 'hot' || states[i] === 'act')) ? states[i] : 'idle'}));
  }
  for (let i = 0; i < n; i++){
    if (arr[i] == null) continue;
    out.push(S.c(px(i), py(i), R, (states && states[i]) || 'idle', String(arr[i]), {fs:R * .95}));
    if (opt.showIndex)
      out.push(S.t(px(i), py(i) + R + .34, String(i), {c:COL.grey, fs:.26}));
  }
  return out;
}

/* -------------------------------------------------------------- renderer */
const svgNS = 'http://www.w3.org/2000/svg';
const mk = (tag, a) => { const e = document.createElementNS(svgNS, tag);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const clear = svg => { while (svg.firstChild) svg.removeChild(svg.firstChild); };

function defs(svg){
  const d = mk('defs', {});
  const f = mk('filter', {id:'glow', x:'-70%', y:'-70%', width:'240%', height:'240%'});
  f.appendChild(mk('feGaussianBlur', {stdDeviation:'.055', result:'b'}));
  const m = mk('feMerge', {});
  m.appendChild(mk('feMergeNode', {in:'b'}));
  m.appendChild(mk('feMergeNode', {in:'SourceGraphic'}));
  f.appendChild(m); d.appendChild(f);
  Object.keys(STY).forEach(k => {
    const mk2 = mk('marker', {id:'ar-' + k, viewBox:'0 0 10 10', refX:'8.5', refY:'5',
      markerWidth:'5.2', markerHeight:'5.2', orient:'auto-start-reverse'});
    mk2.appendChild(mk('path', {d:'M 0 1 L 9 5 L 0 9 z', fill:STY[k].stroke}));
    d.appendChild(mk2);
  });
  svg.appendChild(d);
}

function drawShape(svg, sh){
  const st = STY[sh.s || 'idle'];
  if (sh.t === 'e'){
    let {x1, y1, x2, y2} = sh;
    if (sh.pad){
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
      x1 += dx / L * sh.pad; y1 += dy / L * sh.pad;
      x2 -= dx / L * sh.pad; y2 -= dy / L * sh.pad;
    }
    const a = {x1:x1.toFixed(3), y1:y1.toFixed(3), x2:x2.toFixed(3), y2:y2.toFixed(3),
      stroke:st.stroke, 'stroke-width':(sh.w || st.w || .05), 'stroke-linecap':'round',
      opacity:(sh.o == null ? (sh.s && sh.s !== 'idle' ? 1 : .75) : sh.o)};
    if (sh.dash || st.dash) a['stroke-dasharray'] = sh.dash || st.dash;
    if (sh.arrow !== false) a['marker-end'] = 'url(#ar-' + (sh.s || 'idle') + ')';
    svg.appendChild(mk('line', a));
    if (sh.lab != null)
      svg.appendChild(txt((x1 + x2) / 2 + (sh.lx || 0), (y1 + y2) / 2 + (sh.ly || -.16),
        tr(sh.lab), st.stroke, sh.fs || .30, 'middle'));
    return;
  }
  if (sh.t === 't'){
    svg.appendChild(txt(sh.x, sh.y, tr(sh.s), sh.c || COL.pale, sh.fs || .32,
      sh.anchor || 'middle', sh.o));
    return;
  }
  let node;
  if (sh.t === 'c'){
    node = mk('circle', {cx:sh.x.toFixed(3), cy:sh.y.toFixed(3), r:sh.r.toFixed(3),
      fill:st.fill, stroke:st.stroke, 'stroke-width':st.w});
  } else {
    node = mk('rect', {x:sh.x.toFixed(3), y:sh.y.toFixed(3), width:sh.w.toFixed(3),
      height:sh.h.toFixed(3), rx:(sh.rx == null ? .09 : sh.rx), fill:st.fill,
      stroke:st.stroke, 'stroke-width':st.w});
  }
  if (st.dash || sh.dash) node.setAttribute('stroke-dasharray', sh.dash || st.dash);
  if (st.glow) node.setAttribute('filter', 'url(#glow)');
  if (sh.o != null) node.setAttribute('opacity', sh.o);
  svg.appendChild(node);
  const cx = sh.t === 'c' ? sh.x : sh.x + sh.w / 2;
  const cy = sh.t === 'c' ? sh.y : sh.y + sh.h / 2;
  if (sh.lab != null && sh.lab !== '')
    svg.appendChild(txt(cx + (sh.dx || 0), cy + (sh.fs || .40) * .35, tr(sh.lab), st.text,
      sh.fs || .40, 'middle'));
  if (sh.sub != null)
    svg.appendChild(txt(cx, cy + (sh.t === 'c' ? sh.r : sh.h) + .34, tr(sh.sub),
      sh.subc || COL.grey, sh.subfs || .28, 'middle'));
  if (sh.top != null)
    svg.appendChild(txt(cx, cy - (sh.t === 'c' ? sh.r : sh.h / 2) - .22, tr(sh.top),
      sh.topc || COL.purpleL, sh.topfs || .28, 'middle'));
}
function txt(x, y, s, c, fs, anchor, o){
  const t = mk('text', {x:(+x).toFixed(3), y:(+y).toFixed(3), 'text-anchor':anchor || 'middle',
    fill:c, 'font-size':(+fs).toFixed(3)});
  if (o != null) t.setAttribute('opacity', o);
  t.textContent = s;
  return t;
}

function renderStage(frame){
  const svg = $('stage');
  clear(svg); defs(svg);
  const v = frame.view || curTab().view || [10, 6.4];
  svg.setAttribute('viewBox', '0 0 ' + v[0] + ' ' + v[1]);
  (frame.shapes || []).forEach(sh => drawShape(svg, sh));
}

function drawPanels(frame){
  const box = $('panels'); box.innerHTML = '';
  (frame.panels || []).forEach(p => {
    const d = document.createElement('div'); d.className = 'panel';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = tr(p.lbl);
    const c = document.createElement('div'); c.className = 'chips';
    (p.chips.length ? p.chips : [{t:'—', cls:'empty'}]).forEach(ch => {
      const s = document.createElement('span');
      s.className = 'chip ' + (ch.cls || ''); s.textContent = ch.t; c.appendChild(s);
    });
    d.appendChild(l); d.appendChild(c); box.appendChild(d);
  });
}
function drawCode(frame){
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  $('code').innerHTML = curTab().code.map((ln, i) => {
    const h = esc(ln).replace(/(#.*)$/, '<span class="cm">$1</span>');
    return '<span class="ln' + (i === frame.line ? ' on' : '') + '">' + (h || ' ') + '</span>';
  }).join('');
}
function drawLegend(){
  const keys = curTab().legend || ['hot', 'act', 'ok', 'idle'];
  $('legend').innerHTML = keys.map(k => {
    const [c, txt] = Array.isArray(k) ? k : LEGEND[k];
    return '<span><i style="background:' + c + '"></i>' + tr(txt) + '</span>';
  }).join('');
}

let tabIx = 0, varIx = 0, frames = [], cur = 0, timer = null;
const TABS = DAY_META.tabs;
const curTab = () => TABS[tabIx];

function render(){
  if (!frames.length) return;
  cur = Math.max(0, Math.min(cur, frames.length - 1));
  const f = frames[cur];
  $('stage-title').textContent = tr(curTab().stage);
  renderStage(f); drawPanels(f); drawCode(f); drawLegend();
  $('narr').innerHTML = tr(f.msg);
  $('idea').innerHTML = tr(curTab().idea);
  $('stepno').textContent = (cur + 1) + ' / ' + frames.length;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === frames.length - 1;
}
function buildTabs(){
  $('tabs').innerHTML = '';
  TABS.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = tr(t.label);
    if (i === tabIx) b.classList.add('on');
    b.onclick = () => { tabIx = i; varIx = 0; load(); };
    $('tabs').appendChild(b);
  });
  const ex = $('extra'); ex.innerHTML = '';
  const vs = curTab().variants;
  if (vs) vs.forEach((v, i) => {
    const b = document.createElement('button');
    b.textContent = tr(v);
    if (i === varIx) b.classList.add('on');
    b.onclick = () => { varIx = i; load(); };
    ex.appendChild(b);
  });
}
function load(){
  stop();
  frames = curTab().build(varIx) || [];
  cur = 0; buildTabs(); render();
}
function step(d){ stop(); cur += d; render(); }
function reset(){ stop(); cur = 0; render(); }
function stop(){ if (timer){ clearInterval(timer); timer = null; $('play').textContent = tr(T.play); } }
function togglePlay(){
  if (timer){ stop(); return; }
  if (cur >= frames.length - 1) cur = 0;
  $('play').textContent = tr(T.pause);
  timer = setInterval(() => {
    if (cur >= frames.length - 1){ stop(); return; }
    cur++; render();
  }, Number($('speed').value));
}
$('speed').addEventListener('input', () => { if (timer){ stop(); togglePlay(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ step(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ step(-1); e.preventDefault(); }
  else if (e.key === ' '){ togglePlay(); e.preventDefault(); }
});
setLang('zh');
load();

</script>
</body>
