<script>
// DAY: 03
// TITLE_ZH: 樹
// TITLE_EN: Tree
// SUB_ZH: 前序、中序、後序其實只差一行的位置；還有為什麼樹的高度非得用遞迴不可。
// SUB_EN: Preorder, inorder, postorder.
// FOLDER: day%2003%20-%20tree
// MEDIUM: https://medium.com/100-days-of-python/day-03-tree-fe4bfcb4c8e7

const A = [8, 3, 10, 1, 6, null, 14, null, null, 4, 7, null, null, 13];
const L = i => (2 * i + 1 < A.length && A[2 * i + 1] != null) ? 2 * i + 1 : -1;
const R = i => (2 * i + 2 < A.length && A[2 * i + 2] != null) ? 2 * i + 2 : -1;
const tree = (states, opt) => heapTreeShapes(A, .35, 1.15, 9.3, 1.42, states, opt || {});
const chipsOf = (a, cls) => a.map(x => ({t:String(x), cls:cls || ''}));

const CODE_DFS = [
'def walk(node):',
'    if node is None:',
'        return',
'    # 前序 preorder: 這裡 visit(node)',
'    walk(node.left)',
'    # 中序 inorder: 這裡 visit(node)',
'    walk(node.right)',
'    # 後序 postorder: 這裡 visit(node)'];
const CODE_BFS = [
'from collections import deque',
'',
'def level_order(root):',
'    q, out = deque([root]), []',
'    while q:',
'        node = q.popleft()',
'        out.append(node.val)',
'        if node.left:  q.append(node.left)',
'        if node.right: q.append(node.right)',
'    return out'];
const CODE_H = [
'def height(node):',
'    if node is None:',
'        return 0',
'    lh = height(node.left)',
'    rh = height(node.right)',
'    return 1 + max(lh, rh)'];

function buildDFS(v){
  const kind = ['pre', 'in', 'post'][v];
  const name = [{zh:'前序 preorder', en:'preorder'}, {zh:'中序 inorder', en:'inorder'},
                {zh:'後序 postorder', en:'postorder'}][v];
  const line = [3, 5, 7][v];
  const F = new Frames(), out = [], stack = [], st = {};
  const P = () => [
    {lbl:{zh:'呼叫堆疊（遞迴到哪裡）', en:'call stack'}, chips:chipsOf(stack.map(i => A[i]), 'act')},
    {lbl:{zh:'走訪結果', en:'visit order'}, chips:chipsOf(out, 'ok')}];
  const snap = (cur, ln, msg) => {
    const s = Object.assign({}, st); if (cur >= 0) s[cur] = 'hot';
    stack.forEach(i => { if (s[i] !== 'hot') s[i] = 'act'; });
    F.push({shapes:tree(s), panels:P(), line:ln, msg:msg});
  };
  F.push({shapes:tree({}), panels:P(), line:0,
    msg:{zh:'同一棵樹、同一段遞迴，<b>' + tr(name) + '</b>只是把 visit 放在不同的位置。往下看那一行怎麼影響順序。',
         en:'Same tree, same recursion: <b>' + tr(name) + '</b> merely moves the visit line. Watch how that one line changes everything.'}});
  (function go(i){
    if (i < 0) return;
    stack.push(i);
    snap(i, 0, {zh:'進到節點 <b>' + A[i] + '</b>（遞迴深度 ' + stack.length + '）。',
                en:'Entering node <b>' + A[i] + '</b> (recursion depth ' + stack.length + ').'});
    if (kind === 'pre'){ out.push(A[i]); st[i] = 'ok';
      snap(i, line, {zh:'<b>前序</b>：一進來就先記下 <b>' + A[i] + '</b>，再去看小孩。' +
                         '所以父節點永遠排在自己的子樹前面。',
                     en:'<b>Preorder</b>: record <b>' + A[i] + '</b> on arrival, before touching the children. A parent always precedes its subtree.'}); }
    go(L(i));
    if (kind === 'in'){ out.push(A[i]); st[i] = 'ok';
      snap(i, line, {zh:'<b>中序</b>：左子樹整個走完才記下 <b>' + A[i] +
                         '</b>。在二元搜尋樹上，這個順序剛好由小到大。',
                     en:'<b>Inorder</b>: record <b>' + A[i] + '</b> only after the whole left subtree. On a binary search tree this order comes out sorted.'}); }
    go(R(i));
    if (kind === 'post'){ out.push(A[i]); st[i] = 'ok';
      snap(i, line, {zh:'<b>後序</b>：兩邊小孩都處理完才輪到 <b>' + A[i] +
                         '</b>。需要「先算完子樹再合併」的事情都用它。',
                     en:'<b>Postorder</b>: <b>' + A[i] + '</b> comes last, after both children. Use it whenever a node needs its subtrees resolved first.'}); }
    stack.pop();
    if (stack.length)
      snap(-1, 0, {zh:'<b>' + A[i] + '</b> 這一層結束，回到父節點 <b>' + A[stack[stack.length - 1]] + '</b>。',
                   en:'Done with <b>' + A[i] + '</b>, returning to parent <b>' + A[stack[stack.length - 1]] + '</b>.'});
  })(0);
  F.push({shapes:tree(st), panels:P(), line:line,
    msg:{zh:'<b>' + tr(name) + '</b>結果：<b>' + out.join(' → ') + '</b>。每個節點剛好進出一次，<b>O(n)</b>。',
         en:'<b>' + tr(name) + '</b> result: <b>' + out.join(' → ') + '</b>. Every node is entered and left exactly once, <b>O(n)</b>.'}});
  return F.list;
}

function buildBFS(){
  const F = new Frames(), q = [0], out = [], st = {};
  const P = () => [{lbl:{zh:'佇列 queue', en:'queue'}, chips:chipsOf(q.map(i => A[i]), 'act')},
                   {lbl:{zh:'走訪結果', en:'visit order'}, chips:chipsOf(out, 'ok')}];
  const snap = (cur, ln, msg) => {
    const s = Object.assign({}, st); q.forEach(i => s[i] = 'act'); if (cur >= 0) s[cur] = 'hot';
    F.push({shapes:tree(s), panels:P(), line:ln, msg:msg});
  };
  snap(-1, 3, {zh:'層序走訪換一個容器：把堆疊（遞迴）換成<b>佇列</b>，順序就從深度優先變成一層一層。',
               en:'Level order swaps the container: replace the stack (recursion) with a <b>queue</b> and depth-first becomes level-by-level.'});
  while (q.length){
    const i = q.shift();
    out.push(A[i]); st[i] = 'ok';
    snap(i, 5, {zh:'從佇列頭拿出 <b>' + A[i] + '</b> 並記下來。',
                en:'Pop <b>' + A[i] + '</b> from the front of the queue and record it.'});
    const kids = [L(i), R(i)].filter(k => k >= 0);
    kids.forEach(k => q.push(k));
    if (kids.length)
      snap(-1, 7, {zh:'把它的小孩 <b>' + kids.map(k => A[k]).join('、') +
                       '</b> 排到佇列尾巴。先進先出保證同一層的節點會排在一起。',
                   en:'Push its children <b>' + kids.map(k => A[k]).join(', ') +
                      '</b> to the rear. FIFO keeps each level together.'});
  }
  F.push({shapes:tree(st), panels:P(), line:9,
    msg:{zh:'層序結果 <b>' + out.join(' → ') + '</b>——正好是把陣列 A 從左讀到右。' +
            '這個「用佇列一層層擴散」的骨架，之後在圖上就叫 BFS。',
         en:'Level order gives <b>' + out.join(' → ') + '</b> - literally the array read left to right. This queue-driven spreading is exactly what BFS does on a graph.'}});
  return F.list;
}

function buildHeight(){
  const F = new Frames(), st = {}, stack = [], H = {};
  const P = () => [{lbl:{zh:'呼叫堆疊', en:'call stack'}, chips:chipsOf(stack.map(i => A[i]), 'act')},
                   {lbl:{zh:'已算出的高度', en:'heights resolved'},
                    chips:Object.keys(H).map(i => ({t:A[i] + ':' + H[i], cls:'ok'}))}];
  const snap = (cur, ln, msg, style) => {
    const s = Object.assign({}, st); stack.forEach(i => s[i] = 'act');
    if (cur >= 0) s[cur] = style || 'hot';
    F.push({shapes:tree(s), panels:P(), line:ln, msg:msg});
  };
  snap(-1, 0, {zh:'高度沒辦法用一個迴圈算出來，因為<b>一個節點的高度要先知道兩邊子樹的高度</b>。' +
                  '這種「先算小孩」的形狀就是後序。',
               en:'Height cannot be done with a single loop: <b>a node needs both subtree heights first</b>. That "children first" shape is postorder.'});
  const h = i => {
    if (i < 0) return 0;
    stack.push(i);
    snap(i, 0, {zh:'呼叫 <b>height(' + A[i] + ')</b>，先往下鑽。',
                en:'Call <b>height(' + A[i] + ')</b> and dive further down.'});
    const lh = h(L(i)), rh = h(R(i));
    const v = 1 + Math.max(lh, rh);
    H[i] = v; st[i] = 'ok'; stack.pop();
    F.push({shapes:tree(Object.assign({}, st, stack.reduce((a, k) => (a[k] = 'act', a), {}), {[i]:'hot'})),
      panels:P(), line:5,
      msg:{zh:'<b>' + A[i] + '</b> 的左邊高 ' + lh + '、右邊高 ' + rh + '，所以自己是 <b>1 + max = ' + v +
              '</b>。答案是從葉子往上「浮」回來的。',
           en:'<b>' + A[i] + '</b> has left height ' + lh + ' and right height ' + rh + ', so it is <b>1 + max = ' + v +
              '</b>. Answers bubble up from the leaves.'}});
    return v;
  };
  const total = h(0);
  F.push({shapes:tree(st), panels:P(), line:5,
    msg:{zh:'整棵樹高 <b>' + total + '</b>。同一個模板（後序 + 把子樹結果合併）可以算節點數、' +
            '判斷平衡、求直徑，之後在動態規劃和樹狀 DP 都會再看到。',
         en:'The tree is <b>' + total + '</b> tall. The same template - postorder plus combining subtree results - counts nodes, checks balance, finds the diameter, and reappears in tree DP.'}});
  return F.list;
}

const DAY_META = {
  title:{zh:'樹', en:'Tree'},
  sub:{zh:'前序、中序、後序其實只差一行的位置；還有為什麼樹的高度非得用遞迴不可。',
       en:'Preorder, inorder and postorder differ by one line; and why the height of a tree wants recursion.'},
  tabs:[
    {id:'dfs', label:{zh:'深度走訪', en:'DFS traversals'},
     stage:{zh:'同一段遞迴，visit 放在不同位置', en:'One recursion, three visit positions'},
     variants:[{zh:'前序', en:'preorder'}, {zh:'中序', en:'inorder'}, {zh:'後序', en:'postorder'}],
     idea:{zh:'三種走訪的差別只有 <b>visit 那一行擺在哪</b>：進來時、左邊走完時、兩邊都走完時。' +
              '記住它們各自的用途——前序複製結構、中序在 BST 上得到排序、後序負責由下往上彙整。',
           en:'The three traversals differ only in <b>where the visit line sits</b>: on arrival, after the left subtree, or after both. Preorder copies structure, inorder sorts a BST, postorder aggregates bottom-up.'},
     legend:['hot', 'act', 'ok', 'idle'], code:CODE_DFS, build:buildDFS},
    {id:'bfs', label:{zh:'層序走訪', en:'Level order'},
     stage:{zh:'把堆疊換成佇列', en:'Swap the stack for a queue'},
     idea:{zh:'遞迴其實就是借用<b>呼叫堆疊</b>。把容器換成佇列，走訪順序立刻變成一層一層——' +
              '這是深度優先與廣度優先唯一的結構差別。',
           en:'Recursion is really borrowing the <b>call stack</b>. Swap in a queue and the order becomes level by level - that container choice is the only structural difference between DFS and BFS.'},
     legend:['hot', 'act', 'ok', 'idle'], code:CODE_BFS, build:buildBFS},
    {id:'h', label:{zh:'樹高（後序的力量）', en:'height()'},
     stage:{zh:'答案從葉子往上浮', en:'Answers bubble up from the leaves'},
     idea:{zh:'<b>1 + max(左, 右)</b> 這行的前提是兩邊都已經算完。凡是「節點的答案由子樹的答案組成」' +
              '的問題，都可以套這個後序模板。',
           en:'<b>1 + max(left, right)</b> only works once both sides are resolved. Any problem where a node\'s answer is built from its subtrees\' answers fits this postorder template.'},
     legend:['hot', 'act', 'ok', 'idle'], code:CODE_H, build:buildHeight}
  ]
};

</script>
<script>
/* =========================================================================
   100 Days of Python - shared demo engine
   palette: teal/blue-green base, purple pointers, orange "current step"
   ========================================================================= */
const T = {
  title:{zh:DAY_META.title.zh, en:DAY_META.title.en},
  sub:{zh:DAY_META.sub.zh, en:DAY_META.sub.en},
  play:{zh:'▶ 播放', en:'▶ Play'}, pause:{zh:'❚❚ 暫停', en:'❚❚ Pause'},
  speed:{zh:'速度', en:'Speed'}, state:{zh:'演算法狀態', en:'Algorithm state'},
  code:{zh:'程式碼', en:'Code'}, idea:{zh:'重點', en:'The idea'}
};
let LANG = 'zh';
const tr = o => (o == null ? '' : (typeof o === 'string' ? o : (o[LANG] != null ? o[LANG] : o.en)));
const $ = id => document.getElementById(id);

function setLang(l){
  LANG = l;
  document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'en';
  $('btn-zh').classList.toggle('on', l === 'zh');
  $('btn-en').classList.toggle('on', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = tr(T[k]);
  });
  buildTabs(); render();
}

/* --------------------------------------------------------------- palette */
const STY = {
  idle :{fill:'#07293a', stroke:'#0a6b74', text:'#dff2f5', w:.045, glow:0},
  soft :{fill:'#052330', stroke:'#0a6b74', text:'#a8c8d0', w:.035, glow:0},
  hot  :{fill:'#3a2109', stroke:'#ff9736', text:'#ffbe6b', w:.075, glow:.65},
  act  :{fill:'#241542', stroke:'#9d6bff', text:'#c7a6ff', w:.070, glow:.55},
  ok   :{fill:'#08414a', stroke:'#3fe0dd', text:'#d9ffff', w:.070, glow:.5},
  done :{fill:'#062430', stroke:'#2f5661', text:'#7f9aa3', w:.035, glow:0},
  bad  :{fill:'#3a0d0d', stroke:'#ff5c5c', text:'#ff9a9a', w:.070, glow:.4},
  ghost:{fill:'none',    stroke:'#2f5661', text:'#7f9aa3', w:.035, glow:0, dash:'.12 .10'}
};
const COL = {teal:'#12b3b8', tealL:'#3fe0dd', purple:'#9d6bff', purpleL:'#c7a6ff',
             orange:'#ff9736', orangeL:'#ffbe6b', red:'#ff5c5c', grey:'#8fa3ac',
             pale:'#dff2f5', white:'#ffffff'};
const LEGEND = {
  hot:[COL.orange, {zh:'目前這一步', en:'current step'}],
  act:[COL.purple, {zh:'指標 / 走訪位置', en:'pointer / cursor'}],
  ok:[COL.tealL,  {zh:'完成 / 結果', en:'done / result'}],
  bad:[COL.red,   {zh:'失敗 / 要避開的寫法', en:'failure / the wrong way'}],
  done:['#2f5661', {zh:'已處理完', en:'already done'}],
  soft:['#0a6b74', {zh:'其他元素', en:'other items'}],
  idle:['#0a6b74', {zh:'尚未處理', en:'untouched'}]
};
const leg = (...keys) => keys.map(k => LEGEND[k]);

/* ---------------------------------------------------------- frame buffer */
function Frames(){
  this.list = [];
  this.push = (o) => this.list.push({
    shapes:JSON.parse(JSON.stringify(o.shapes || [])),
    panels:JSON.parse(JSON.stringify(o.panels || [])),
    view:(o.view || null), line:(o.line == null ? 0 : o.line), msg:o.msg
  });
}
/* shape helpers - engines call these, the renderer just draws */
const S = {
  r:(x, y, w, h, s, lab, o) => Object.assign({t:'r', x:x, y:y, w:w, h:h, s:s || 'idle', lab:lab}, o || {}),
  c:(x, y, r, s, lab, o) => Object.assign({t:'c', x:x, y:y, r:r, s:s || 'idle', lab:lab}, o || {}),
  e:(x1, y1, x2, y2, o) => Object.assign({t:'e', x1:x1, y1:y1, x2:x2, y2:y2}, o || {}),
  t:(x, y, s, o) => Object.assign({t:'t', x:x, y:y, s:s}, o || {})
};
/* a labelled row of array cells; returns shapes */
function cellRow(vals, x0, y, w, h, opt){
  opt = opt || {};
  const out = [], st = opt.states || {};
  vals.forEach((v, i) => {
    out.push(S.r(x0 + i * w, y, w - (opt.gap == null ? .06 : opt.gap), h, st[i] || 'idle',
                 v == null ? '' : String(v), {fs:opt.fs || h * .52}));
    if (opt.index !== false)
      out.push(S.t(x0 + i * w + (w - .06) / 2, y + h + (opt.ilift || .34),
                   opt.labels ? opt.labels[i] : String(i),
                   {c:st[i] && st[i] !== 'idle' ? COL.orangeL : COL.grey, fs:opt.ifs || .30}));
  });
  if (opt.title) out.push(S.t(x0 - .22, y + h * .62, opt.title, {c:COL.tealL, fs:.32, anchor:'end'}));
  return out;
}
/* binary-tree layout from a heap-style array (index 0 = root, 2i+1 / 2i+2) */
function heapTreeShapes(arr, x0, y0, w, rowH, states, opt){
  opt = opt || {};
  const n = arr.length, out = [], R = opt.r || .34;
  const depth = i => Math.floor(Math.log2(i + 1));
  const maxD = n ? depth(n - 1) : 0;
  const px = i => {
    const d = depth(i), first = Math.pow(2, d) - 1, k = i - first;
    const slots = Math.pow(2, d), span = w;
    return x0 + span * (k + .5) / slots;
  };
  const py = i => y0 + depth(i) * rowH;
  for (let i = 1; i < n; i++){
    if (arr[i] == null) continue;
    const p = Math.floor((i - 1) / 2);
    out.push(S.e(px(p), py(p), px(i), py(i), {pad:R + .04,
      s:(states && (states[i] === 'hot' || states[i] === 'act')) ? states[i] : 'idle'}));
  }
  for (let i = 0; i < n; i++){
    if (arr[i] == null) continue;
    out.push(S.c(px(i), py(i), R, (states && states[i]) || 'idle', String(arr[i]), {fs:R * .95}));
    if (opt.showIndex)
      out.push(S.t(px(i), py(i) + R + .34, String(i), {c:COL.grey, fs:.26}));
  }
  return out;
}

/* -------------------------------------------------------------- renderer */
const svgNS = 'http://www.w3.org/2000/svg';
const mk = (tag, a) => { const e = document.createElementNS(svgNS, tag);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const clear = svg => { while (svg.firstChild) svg.removeChild(svg.firstChild); };

function defs(svg){
  const d = mk('defs', {});
  const f = mk('filter', {id:'glow', x:'-70%', y:'-70%', width:'240%', height:'240%'});
  f.appendChild(mk('feGaussianBlur', {stdDeviation:'.055', result:'b'}));
  const m = mk('feMerge', {});
  m.appendChild(mk('feMergeNode', {in:'b'}));
  m.appendChild(mk('feMergeNode', {in:'SourceGraphic'}));
  f.appendChild(m); d.appendChild(f);
  Object.keys(STY).forEach(k => {
    const mk2 = mk('marker', {id:'ar-' + k, viewBox:'0 0 10 10', refX:'8.5', refY:'5',
      markerWidth:'5.2', markerHeight:'5.2', orient:'auto-start-reverse'});
    mk2.appendChild(mk('path', {d:'M 0 1 L 9 5 L 0 9 z', fill:STY[k].stroke}));
    d.appendChild(mk2);
  });
  svg.appendChild(d);
}

function drawShape(svg, sh){
  const st = STY[sh.s || 'idle'];
  if (sh.t === 'e'){
    let {x1, y1, x2, y2} = sh;
    if (sh.pad){
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
      x1 += dx / L * sh.pad; y1 += dy / L * sh.pad;
      x2 -= dx / L * sh.pad; y2 -= dy / L * sh.pad;
    }
    const a = {x1:x1.toFixed(3), y1:y1.toFixed(3), x2:x2.toFixed(3), y2:y2.toFixed(3),
      stroke:st.stroke, 'stroke-width':(sh.w || st.w || .05), 'stroke-linecap':'round',
      opacity:(sh.o == null ? (sh.s && sh.s !== 'idle' ? 1 : .75) : sh.o)};
    if (sh.dash || st.dash) a['stroke-dasharray'] = sh.dash || st.dash;
    if (sh.arrow !== false) a['marker-end'] = 'url(#ar-' + (sh.s || 'idle') + ')';
    svg.appendChild(mk('line', a));
    if (sh.lab != null)
      svg.appendChild(txt((x1 + x2) / 2 + (sh.lx || 0), (y1 + y2) / 2 + (sh.ly || -.16),
        tr(sh.lab), st.stroke, sh.fs || .30, 'middle'));
    return;
  }
  if (sh.t === 't'){
    svg.appendChild(txt(sh.x, sh.y, tr(sh.s), sh.c || COL.pale, sh.fs || .32,
      sh.anchor || 'middle', sh.o));
    return;
  }
  let node;
  if (sh.t === 'c'){
    node = mk('circle', {cx:sh.x.toFixed(3), cy:sh.y.toFixed(3), r:sh.r.toFixed(3),
      fill:st.fill, stroke:st.stroke, 'stroke-width':st.w});
  } else {
    node = mk('rect', {x:sh.x.toFixed(3), y:sh.y.toFixed(3), width:sh.w.toFixed(3),
      height:sh.h.toFixed(3), rx:(sh.rx == null ? .09 : sh.rx), fill:st.fill,
      stroke:st.stroke, 'stroke-width':st.w});
  }
  if (st.dash || sh.dash) node.setAttribute('stroke-dasharray', sh.dash || st.dash);
  if (st.glow) node.setAttribute('filter', 'url(#glow)');
  if (sh.o != null) node.setAttribute('opacity', sh.o);
  svg.appendChild(node);
  const cx = sh.t === 'c' ? sh.x : sh.x + sh.w / 2;
  const cy = sh.t === 'c' ? sh.y : sh.y + sh.h / 2;
  if (sh.lab != null && sh.lab !== '')
    svg.appendChild(txt(cx + (sh.dx || 0), cy + (sh.fs || .40) * .35, tr(sh.lab), st.text,
      sh.fs || .40, 'middle'));
  if (sh.sub != null)
    svg.appendChild(txt(cx, cy + (sh.t === 'c' ? sh.r : sh.h) + .34, tr(sh.sub),
      sh.subc || COL.grey, sh.subfs || .28, 'middle'));
  if (sh.top != null)
    svg.appendChild(txt(cx, cy - (sh.t === 'c' ? sh.r : sh.h / 2) - .22, tr(sh.top),
      sh.topc || COL.purpleL, sh.topfs || .28, 'middle'));
}
function txt(x, y, s, c, fs, anchor, o){
  const t = mk('text', {x:(+x).toFixed(3), y:(+y).toFixed(3), 'text-anchor':anchor || 'middle',
    fill:c, 'font-size':(+fs).toFixed(3)});
  if (o != null) t.setAttribute('opacity', o);
  t.textContent = s;
  return t;
}

function renderStage(frame){
  const svg = $('stage');
  clear(svg); defs(svg);
  const v = frame.view || curTab().view || [10, 6.4];
  svg.setAttribute('viewBox', '0 0 ' + v[0] + ' ' + v[1]);
  (frame.shapes || []).forEach(sh => drawShape(svg, sh));
}

function drawPanels(frame){
  const box = $('panels'); box.innerHTML = '';
  (frame.panels || []).forEach(p => {
    const d = document.createElement('div'); d.className = 'panel';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = tr(p.lbl);
    const c = document.createElement('div'); c.className = 'chips';
    (p.chips.length ? p.chips : [{t:'—', cls:'empty'}]).forEach(ch => {
      const s = document.createElement('span');
      s.className = 'chip ' + (ch.cls || ''); s.textContent = ch.t; c.appendChild(s);
    });
    d.appendChild(l); d.appendChild(c); box.appendChild(d);
  });
}
function drawCode(frame){
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  $('code').innerHTML = curTab().code.map((ln, i) => {
    const h = esc(ln).replace(/(#.*)$/, '<span class="cm">$1</span>');
    return '<span class="ln' + (i === frame.line ? ' on' : '') + '">' + (h || ' ') + '</span>';
  }).join('');
}
function drawLegend(){
  const keys = curTab().legend || ['hot', 'act', 'ok', 'idle'];
  $('legend').innerHTML = keys.map(k => {
    const [c, txt] = Array.isArray(k) ? k : LEGEND[k];
    return '<span><i style="background:' + c + '"></i>' + tr(txt) + '</span>';
  }).join('');
}

let tabIx = 0, varIx = 0, frames = [], cur = 0, timer = null;
const TABS = DAY_META.tabs;
const curTab = () => TABS[tabIx];

function render(){
  if (!frames.length) return;
  cur = Math.max(0, Math.min(cur, frames.length - 1));
  const f = frames[cur];
  $('stage-title').textContent = tr(curTab().stage);
  renderStage(f); drawPanels(f); drawCode(f); drawLegend();
  $('narr').innerHTML = tr(f.msg);
  $('idea').innerHTML = tr(curTab().idea);
  $('stepno').textContent = (cur + 1) + ' / ' + frames.length;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === frames.length - 1;
}
function buildTabs(){
  $('tabs').innerHTML = '';
  TABS.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = tr(t.label);
    if (i === tabIx) b.classList.add('on');
    b.onclick = () => { tabIx = i; varIx = 0; load(); };
    $('tabs').appendChild(b);
  });
  const ex = $('extra'); ex.innerHTML = '';
  const vs = curTab().variants;
  if (vs) vs.forEach((v, i) => {
    const b = document.createElement('button');
    b.textContent = tr(v);
    if (i === varIx) b.classList.add('on');
    b.onclick = () => { varIx = i; load(); };
    ex.appendChild(b);
  });
}
function load(){
  stop();
  frames = curTab().build(varIx) || [];
  cur = 0; buildTabs(); render();
}
function step(d){ stop(); cur += d; render(); }
function reset(){ stop(); cur = 0; render(); }
function stop(){ if (timer){ clearInterval(timer); timer = null; $('play').textContent = tr(T.play); } }
function togglePlay(){
  if (timer){ stop(); return; }
  if (cur >= frames.length - 1) cur = 0;
  $('play').textContent = tr(T.pause);
  timer = setInterval(() => {
    if (cur >= frames.length - 1){ stop(); return; }
    cur++; render();
  }, Number($('speed').value));
}
$('speed').addEventListener('input', () => { if (timer){ stop(); togglePlay(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ step(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ step(-1); e.preventDefault(); }
  else if (e.key === ' '){ togglePlay(); e.preventDefault(); }
});
setLang('zh');
load();

</script>
</body>
